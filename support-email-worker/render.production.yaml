# NEW isolated service only. Do not sync as the main application Blueprint.
# All approvals/gates start OFF; secrets must be separately approved and mounted.
services:
  - type: cron
    name: alphascreen-alphy-mail-prod
    runtime: node
    repo: https://github.com/alphaSourceMain/interview-agent-backend-qa
    branch: support-email-qa-20261007
    plan: starter
    region: oregon
    autoDeployTrigger: off
    schedule: "*/5 * * * *"
    buildCommand: npm ci --ignore-scripts --prefix support-email-worker
    startCommand: node support-email-worker/tick.js
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: SUPABASE_URL
        value: https://rytlclkkcvvnkoncfaid.supabase.co
      - key: SUPPORT_EMAIL_ENVIRONMENT
        value: production
      - key: SUPPORT_EMAIL_MAILBOX
        value: alphy@alphasourceai.com
      - key: SUPPORT_EMAIL_OWNER_TEST_ONLY
        value: "true"
      - key: SUPPORT_EMAIL_OWNER_TEST_SENDER
        value: jason@gardner.ltd
      - key: SUPPORT_EMAIL_WORKER_ENABLED
        value: "false"
      - key: SUPPORT_EMAIL_WORKER_MODE
        value: production-draft
      - key: SUPPORT_EMAIL_PRODUCTION_RELEASE_APPROVED
        value: "false"
      - key: SUPPORT_EMAIL_PRODUCTION_SERVICE_ROLE_APPROVED
        value: "false"
      - key: SUPPORT_EMAIL_CUSTOMER_RESPONSES_APPROVED
        value: "false"
      - key: SUPPORT_EMAIL_WORKER_SEND_APPROVED
        value: "false"
      - key: SUPPORT_EMAIL_HUMAN_CC_RULE_APPROVED
        value: "false"
      - key: SUPPORT_EMAIL_SECRET_MOUNT_APPROVED
        value: "false"
      - key: SUPPORT_EMAIL_SECRET_LAYOUT
        value: render-projected-v1
      - key: SUPPORT_EMAIL_MOUNT_MANIFEST
        value: "{}"
